      const hotelStart = aktive.filter(e=>e.element_type==='hotel'&&e.start_date)
                               .map(e=>e.start_date).sort();
      const foersteHotel = hotelStart[0] || t.departure_date;
      const rang = e => {
        if(e.element_type==='flight'||e.element_type==='ticket')
          return (e.start_date||'') <= foersteHotel ? 1 : 6;   // udrejse først, hjemrejse sidst
        if(e.element_type==='transfer') return 3;              // altid mellem fly og hotel
        if(e.element_type==='hotel')    return 4;              // indtjekning efter transferen
        return 5;
      };
      const grupper=new Map();
      aktive.slice().sort((a,b)=>
          (a.start_date||'9999').localeCompare(b.start_date||'9999') || (rang(a)-rang(b)))
        .forEach(e=>{ const k=nøgle(e); const g=grupper.get(k);
          if(g){ g.n++; g.sum+= +(e.buy_amount_dkk||0); g.ids.push(e.id); }
          else grupper.set(k,{e, n:1, sum:+(e.buy_amount_dkk||0), ids:[e.id]}); });
      let dag='';
      return [...grupper.values()].map(({e,n,sum,ids})=>{
        const d=e.details||{};
        const naetter = e.element_type==='hotel'&&e.start_date&&e.end_date
          ? Math.round((new Date(e.end_date)-new Date(e.start_date))/86400000) : null;
        let titel, linje2='';
        if(e.element_type==='flight'||e.element_type==='ticket'){
          const rute=d.rute||d.route||[d.from,d.to].filter(Boolean).join(' → ');
          titel = rute ? rute.replace(/\s*-\s*/g,' → ') : tx('el.flight');
          linje2=[d.flynr, d.flyselskab||d.airline, d.saeder||d.class, d.pnr?'PNR '+d.pnr:'']
                 .filter(Boolean).join(' · ');
        } else if(e.element_type==='hotel'){
          titel=(e.suppliers&&e.suppliers.name)||e.description;
          linje2=[d.room_navn||d.room, d.board, d.rooms>1?d.rooms+' vær.':'', d.adresse]
                 .filter(Boolean).join(' · ');
        } else if(e.element_type==='transfer'){
          titel=d.produkt||e.description;
          linje2=[d.fra&&d.til?`${d.fra} → ${d.til}`:'', d.tidspunkt?'kl. '+d.tidspunkt:'',
                  d.selskab||(e.suppliers&&e.suppliers.name)||''].filter(Boolean).join(' · ');
        } else {
          titel=d.produkt||e.description;
          linje2=(e.suppliers&&e.suppliers.name)||'';
        }
        const dato = e.element_type==='hotel'&&naetter
          ? `${fmtDY(e.start_date)} → ${fmtDY(e.end_date)} · ${naetter} ${tx('sum.nights')}`
          : fmtDY(e.start_date);
        const nyDag = e.start_date!==dag ? (dag=e.start_date, true) : false;
        const skjul=new Set(['produkt','rute','route','from','to','flyselskab','airline','class','pnr','room','room_navn',
          'board','rooms','source','dolphin_status','financial_vendor','buy_dkk_foer_regulering',
          'buy_dkk_foer_afbestilling','reguleret','afbestilt_note','dato_mangler_i_rapport','datofejl_rettet']);
        const detaljer=Object.entries(d).filter(([k,v])=>!skjul.has(k)&&v!==''&&v!==null&&v!==false)
          .map(([k,v])=>`<span class="dt"><span class="muted">${DETAIL_LABELS[k]||k}</span> ${
            String(v).startsWith('http') ? `<a href="${v}" target="_blank" rel="noopener">${String(v).replace(/^https?:\/\//,'').slice(0,42)}</a>` : v
          }</span>`).join('');
        return `${nyDag?`<div class="pgday">${fmtDY(e.start_date)}</div>`:''}
        <details class="pgrow">
          <summary>
            <span class="pgicon">${ICON[e.element_type]||'✦'}</span>
            <span class="pgmain">
              <span class="pgtitle">${titel}${n>1?`<span class="pgqty">×${n}</span>`:''}</span>
              ${linje2?`<span class="pgsub">${linje2}</span>`:''}
            </span>
            <span class="pgright">
              <span class="pgamt">${sum?fmtDkkR(sum):'<span class="muted">inkl.</span>'}</span>
              ${e.element_type==='hotel'&&naetter?`<span class="pgnights">${naetter} ${tx('sum.nights')}</span>`:''}
            </span>
          </summary>
          <div class="pgbody">
            <div class="pgmeta">${dato}
              ${e.buy_currency&&e.buy_currency!=='DKK'&&e.buy_amount?` · ${fmtFX(e.buy_amount,e.buy_currency)} × ${Number(e.buy_fx_rate||0).toLocaleString('da-DK',{minimumFractionDigits:4})}`:''}
              ${e.vendor_due_date?` · <b style="color:var(--gold)">${tx('prog.paydue')} ${fmtDY(e.vendor_due_date)}</b>`:''}</div>
            ${detaljer?`<div class="pgdet">${detaljer}</div>`:''}
            <button class="btn ghost" style="padding:2px 9px;font-size:10px;margin-top:7px" onclick="editEl('${id}','${ids[0]}')">${tx('prog.edit')}</button>
          </div>
        </details>`;}).join('');
    })()}
    <button class="btn ghost" style="margin-top:12px" onclick="showElForm('${id}')">${tx('prog.add')}</button>
  </div>


  <div class="card"><h3>${tx('sup.title')}</h3>
    ${(()=>{const ps=VENDOR_PAYMENTS.filter(p=>p.folder===String(t.ref_no).replace(/^[A-Za-z]+/,'')||p.branch+p.folder===t.ref_no); if(!ps.length) return '<p class="muted">Ingen leverandørbetalinger i rapporten for denne rejse.</p>';
      return `<table><tr><th>Forfald</th><th>Leverandør</th><th class="r">Beløb</th><th class="r">DKK</th></tr>`+ps.sort((a,b)=>(a.due||'').localeCompare(b.due||'')).map(p=>`<tr><td class="${p.dkk>0&&p.due<=today()?'overdue':''}" style="white-space:nowrap">${fmtDY(p.due)}</td><td><b>${vpName(p.vendor)}</b> <span class="mini">${p.product||''}</span></td><td class="r" style="font-weight:600;color:${p.dkk<0?'var(--ok)':'inherit'}">${fmtFX(p.vendorAmt,p.cur)}${p.dkk<0?' (kredit)':''}</td><td class="r mini">${fmtDkkR(p.dkk)}</td></tr>`).join('')+`</table>`;})()}

      ${(()=>{const net=FINV.reduce((s,fi)=>s+(fi.doc_type==='creditnote'?-1:1)*Math.abs(+fi.total_dkk||0),0);
        return `<div style="margin:0 0 5px;font-weight:600;color:var(--ink);font-size:12px">Fakturaer på rejsen — Billetkontoret</div>
      ${FINV.length?`<div class="finvbox">
        ${FINV.map(fi=>{const cred=fi.doc_type==='creditnote';const ord={fare:1,tax:2,handling_fee:3,dc:4,fee:5,other:6};
          const LT={fare:'Billetpris',tax:'Skatter & afgifter',handling_fee:'Handling fee',dc:'DC',fee:'Gebyr',other:'Øvrigt'};
          const lines=(fi.flight_invoice_lines||[]).slice().sort((a,b)=>(ord[a.line_type]||9)-(ord[b.line_type]||9));
          return `<details class="finv"><summary>
            <span><b style="color:var(--ink)">${cred?'Kreditnota':'Faktura'} ${fi.invoice_no||''}</b> <span class="muted">· ${fi.airline||'Fly'}${fi.pnr?' · '+fi.pnr:''} · ${fmtDY(fi.invoice_date)}</span></span>
            <span class="fitot" style="color:${cred?'var(--ok)':'var(--ink)'}">${cred?'-':''}${fmtDkkR(Math.abs(fi.total_dkk||0))}</span>
          </summary>
          <div class="finbody">
            <table style="font-size:11px"><tr class="mini muted"><th style="text-align:left">Prislinje</th><th class="r">Pr. rejsende</th><th class="r">Antal</th><th class="r">I alt DKK</th></tr>
              ${lines.map(l=>`<tr><td>${l.label||LT[l.line_type]||l.line_type}</td><td class="r">${l.unit_amount_dkk!=null?fmtDkkR(l.unit_amount_dkk):'—'}</td><td class="r">${l.pax_count!=null?l.pax_count:'—'}</td><td class="r">${cred?'-':''}${fmtDkkR(Math.abs(l.amount_dkk||0))}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Ingen prislinjer.</td></tr>'}
              <tr style="border-top:1px solid var(--line);font-weight:700"><td>I alt</td><td></td><td></td><td class="r">${cred?'-':''}${fmtDkkR(Math.abs(fi.total_dkk||0))}</td></tr>
            </table>
            <div class="mini muted" style="margin-top:7px"><i>Bilag/PDF kobles på når dokumenterne er samlet i den nye database.</i></div>
          </div></details>`;}).join('')}
        <div class="finv-total"><span>Fly i alt (netto)</span><span style="margin-left:auto;font-variant-numeric:tabular-nums">${fmtDkkR(net)}</span></div>
      </div>`:'<div style="margin:2px 0 18px;font-size:11px" class="muted">Ingen flyfakturaer importeret for denne rejse endnu — flyudgiften vises som «Fly + øvrigt» ovenfor.</div>'}`;})()}
  </div>
  <div class="card"><h3>Opgaver på rejsen</h3>
    ${(tasks||[]).map(k=>`<div class="task-line ${k.status!=='aaben'?'muted':''}">
      ${k.status==='aaben'?`<input type="checkbox" onchange="doneTask('${k.id}','${id}')">`:'✓'}
      <span style="flex:1;${k.status!=='aaben'?'text-decoration:line-through':''}">${k.title}</span>
      <span class="muted">${k.assignee||''} · ${fmtD(k.due_date)}</span></div>`).join('')||'<p class="muted">Ingen opgaver.</p>'}
  </div>

  ${(()=>{ /* ── Historik: hvem gjorde hvad, hvornår ── */
    const WHAT={trips:tx('hist.trip'), trip_elements:tx('hist.element'), payments:tx('hist.payment'),
                tasks:tx('hist.task'), travelers:tx('hist.trav'), trip_travelers:tx('hist.trav')};
    const ACT={INSERT:tx('hist.created'), UPDATE:tx('hist.updated'), DELETE:tx('hist.deleted')};
    /* Slå ændringer på samme dag, af samme person, på samme tabel sammen — ellers drukner listen */
    const grupper=[];
    HIST.forEach(x=>{
      const dag=(x.at||'').slice(0,10);
      const sidste=grupper[grupper.length-1];
      if(sidste && sidste.dag===dag && sidste.who===x.actor_name && sidste.tbl===x.table_name && sidste.act===x.action){ sidste.n++; return; }
      grupper.push({dag, who:x.actor_name, tbl:x.table_name, act:x.action, at:x.at, n:1});
    });
    return `<details class="card histcard">
      <summary><h3 style="display:inline">${tx('hist.title')}</h3> <span class="muted">${HIST.length}</span></summary>
      ${grupper.length?`<div class="histlist">${grupper.slice(0,40).map(g=>`
        <div class="histrow"><span class="hwhen">${fmtDY(g.dag)}</span>
        <span class="hwho">${g.who}</span>
        <span class="hwhat">${ACT[g.act]||g.act} ${WHAT[g.tbl]||g.tbl}${g.n>1?` <span class="muted">×${g.n}</span>`:''}</span></div>`).join('')}</div>`
        :`<p class="muted">${tx('hist.none')}</p>`}
    </details>`;})()}
  <dialog id="eldlg"></dialog>
  <dialog id="paxdlg"></dialog>`;
}
async function setStatus(id,s){ await db.from('trips').update({status:s}).eq('id',id); viewTrip(id); }
async function setStatusSel(id,s){
  if(!s) return;
  if(s==='canx'){ alert('Brug "Afbestil rejse…" for at afbestille — så håndteres penge, elementer og kundebekræftelse korrekt.'); return viewTrip(id); }
  const t=window.TRIP;
  if(t && t.status==='canx' && !confirm('Fortryd afbestillingen og sæt status til "'+STATUS_LABELS[s]+'"?\n\nOBS: registrerede refusioner/kreditter/tab nulstilles IKKE automatisk — gennemgå posteringerne bagefter.')) return viewTrip(id);
  const patch={status:s};
  if(t && t.status==='canx'){ patch.cancelled_at=null; patch.retained_dkk=0; patch.loss_dkk=0; patch.refund_dkk=0; }

}

// ═══ AFBESTILLINGS-FLOW ═══════════════════════════════════════════════════
// Gældende afbestillingsvilkår (Generelle vilkår §6.2). Redigér her hvis vilkårene ændres.
const AFBESTIL_VILKAAR = `Afbestilling mere end 60 dage før afrejse: afbestillingsgebyret svarer til det beløb, der er indbetalt eller forfaldent på afbestillingstidspunktet (typisk depositum, men kan være rejsens fulde pris afhængigt af leverandørens betingelser). Afbestilling færre end 60 dage før afrejse: afbestillingsgebyret er i alle tilfælde 100 %. Ved uundgåelige og ekstraordinære omstændigheder (fx krigshandlinger) på destinationen kan rejsen afbestilles gebyrfrit senest 14 dage før afrejse med fuld refusion. Ovenstående gælder medmindre andet er anført i ordrebekræftelsen.`;
const CX_OUTCOMES = {
  ikke_betalt:'Ikke betalt til leverandør — intet tab',
  kreditnota:'Betalt → kreditnota fra leverandør',
  refunderet:'Betalt → penge retur fra leverandør',
  tabt:'Betalt → tabt (inden for frist / ikke-refunderbart)'
};
const daysTo = d => d? Math.round((new Date(d)-new Date(today()))/86400000):null;
function cxNum(id){ const v=parseFloat((document.getElementById(id)||{}).value); return isNaN(v)?0:v; }

function openCancel(id){
  const t=window.TRIP, els=window.ELS||[];
  const dtd=daysTo(t.departure_date);
  const regel = dtd===null?'ukendt afrejsedato': dtd<60?`${dtd} dage til afrejse → gebyr 100 %`:`${dtd} dage til afrejse → gebyr = indbetalt/forfaldent (typisk depositum)`;
  const paidGuess = t.deposit_amount||'';
  const d=$('#eldlg');
  d.innerHTML=`<h2 class="pf" style="font-weight:600;margin-top:0;color:var(--bad)">Afbestil rejse · ${t.ref_no}</h2>
  <p class="muted" style="margin:0 0 10px">${kName(t)} · afrejse ${fmtDY(t.departure_date)} · <b>${regel}</b></p>
  <div class="row"><div style="flex:2"><label>Årsag til afbestilling</label><input id="cx_reason" placeholder="fx kundens ønske / sygdom / krigsændring"></div>
    <div><label style="display:flex;gap:6px;align-items:center;margin-top:22px"><input type="checkbox" id="cx_war" onchange="cxRecalc()"> Gebyrfri (krig/ekstraordinært)</label></div></div>

  <h3 style="margin:14px 0 4px;color:var(--forest)">Elementer</h3>
  <div style="font-size:11px" class="muted">Vælg hvad der sker med hvert element. Beløb = købspris i DKK vi har/havde hos leverandøren.</div>
  <table style="width:100%;font-size:12px;margin:6px 0 4px"><tr><th></th><th style="text-align:left">Element</th><th style="text-align:left">Udfald</th><th class="r">Beløb DKK</th></tr>
  ${els.map((e,i)=>{
    const amt = Math.round(e.buy_amount_dkk|| (e.buy_amount&&(e.buy_currency==='DKK')?e.buy_amount:0) ||0);
    const already=['cx','refunderet'].includes(e.status);
    return `<tr>
      <td><input type="checkbox" id="cx_el_${i}" ${already?'':'checked'} onchange="cxRecalc()"></td>
      <td>${EL_TYPES[e.element_type]||e.element_type}: ${e.description}<div class="muted" style="font-size:10px">${e.suppliers?e.suppliers.name:'(ingen leverandør)'} · nu: ${e.status}</div></td>
      <td><select id="cx_out_${i}" onchange="cxRecalc()">${Object.entries(CX_OUTCOMES).map(([k,v])=>`<option value="${k}" ${k==='ikke_betalt'?'selected':''}>${v}</option>`).join('')}</select></td>
      <td class="r"><input id="cx_amt_${i}" type="number" step="0.01" value="${amt||''}" style="width:110px;text-align:right" oninput="cxRecalc()"></td>
    </tr>`;}).join('')||'<tr><td colspan="4" class="muted">Ingen elementer registreret.</td></tr>'}
  </table>

  <h3 style="margin:14px 0 4px;color:var(--forest)">Kundens penge</h3>
  <div class="row">
    <div><label>Indbetalt af kunde (DKK)</label><input id="cx_paid" type="number" step="0.01" value="${paidGuess}" oninput="cxRecalc()"></div>
    <div><label>Afbestillingsgebyr / tilbageholdes (DKK)</label><input id="cx_fee" type="number" step="0.01" oninput="cxManualFee=true;cxRecalc()"></div>
    <div><label>Til refusion til kunde (DKK)</label><input id="cx_refund" type="number" step="0.01" oninput="cxManualRefund=true;cxRecalc()"></div>
  </div>
  <label style="display:flex;gap:6px;align-items:center;font-size:12px;margin-top:6px"><input type="checkbox" id="cx_bookpaid" checked> Opret kundens indbetaling som postering (hvis den ikke allerede er bogført)</label>
  <div id="cx_summary" class="muted" style="font-size:11.5px;margin:8px 0"></div>

  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn danger" onclick="doCancel('${t.id}')">Bekræft afbestilling</button>
    <button class="btn ghost" onclick="document.getElementById('eldlg').close()">Fortryd</button>
    <span class="muted" style="font-size:11px;align-self:center">Sætter status = Afbestilt, opdaterer elementer, opretter kreditter/refusion, opgaver og en bekræftelse til kunden.</span>
  </div>
  <div class="err" id="cxerr"></div>`;
  window.cxManualFee=false; window.cxManualRefund=false; window.CX_N=els.length;
  d.showModal(); cxRecalc();
}
function cxRecalc(){
  const t=window.TRIP, n=window.CX_N||0, dtd=daysTo(t.departure_date);
  let loss=0, credit=0, refundSup=0;
  for(let i=0;i<n;i++){ const on=(document.getElementById('cx_el_'+i)||{}).checked; if(!on)continue;
    const out=(document.getElementById('cx_out_'+i)||{}).value; const a=cxNum('cx_amt_'+i);
    if(out==='tabt')loss+=a; else if(out==='kreditnota')credit+=a; else if(out==='refunderet')refundSup+=a; }
  const paid=cxNum('cx_paid');
  if(!window.cxManualFee){ // auto-gebyr efter vilkår
    let fee = (document.getElementById('cx_war')||{}).checked ? 0 : (dtd!==null && dtd<60 ? paid : (t.deposit_amount||Math.min(paid,loss)||0));
    fee=Math.min(fee,paid); const f=document.getElementById('cx_fee'); if(f)f.value=fee?Math.round(fee*100)/100:0;
  }
  const fee=cxNum('cx_fee');
  if(!window.cxManualRefund){ const r=document.getElementById('cx_refund'); if(r)r.value=Math.max(0,Math.round((paid-fee)*100)/100); }
  const refund=cxNum('cx_refund');
  const net=fee-loss;
  const s=document.getElementById('cx_summary');
  if(s)s.innerHTML=`Tilbageholdt fra kunde (indtægt): <b>${fmtKr(fee)}</b> · Til refusion: <b>${fmtKr(refund)}</b> · Leverandørtab: <b>${fmtKr(loss)}</b> · Kreditnotaer: <b>${fmtKr(credit)}</b> · Leverandørrefusion: <b>${fmtKr(refundSup)}</b><br><b style="color:${net>=0?'var(--ok)':'var(--bad)'}">Nettoresultat af afbestilling: ${fmtKr(net)} DKK</b> (tilbageholdt − tab)`;
}
async function doCancel(id){
  const t=window.TRIP, els=window.ELS||[], n=els.length;
  const err=$('#cxerr'); err.textContent='';
  const reason=($('#cx_reason').value||'').trim();
  const war=$('#cx_war').checked;
  const paid=cxNum('cx_paid'), fee=cxNum('cx_fee'), refund=cxNum('cx_refund');
  if(!confirm(`Afbestil ${t.ref_no}?\n\nTilbageholdt: ${fmtKr(fee)} · Refusion til kunde: ${fmtKr(refund)} DKK`)) return;
  try{
    let loss=0; const creditRows=[]; const taskRows=[]; const cur=t.customer_currency||'DKK';
    for(let i=0;i<n;i++){ const e=els[i]; if(!(document.getElementById('cx_el_'+i)||{}).checked) continue;
      const out=document.getElementById('cx_out_'+i).value; const a=cxNum('cx_amt_'+i);
      const newStatus = out==='refunderet' ? 'refunderet' : 'cx';
      await db.from('trip_elements').update({status:newStatus}).eq('id',e.id);
      const supId=e.financial_supplier_id||e.supplier_id||null;
      if(out==='kreditnota' && supId && a>0){ creditRows.push({supplier_id:supId, origin_trip_id:id, currency:'DKK', amount:a, note:`Kreditnota – afbestilt ${t.ref_no}: ${e.description}`}); }
      if(out==='tabt') loss+=a;
      taskRows.push({trip_id:id, element_id:e.id, task_type:'afbestil_element', title:`Afbestil hos leverandør: ${e.description}${e.suppliers?' ('+e.suppliers.name+')':''}`, assignee:t.owner||null, due_date:today(), auto_generated:true});
      if(supId && out!=='ikke_betalt'){ taskRows.push({trip_id:id, element_id:e.id, task_type:'kredit_refusion', title:`Tjek ${out==='kreditnota'?'kreditnota':out==='refunderet'?'refusion':'evt. refusion'} hos ${e.suppliers?e.suppliers.name:'leverandør'}: ${e.description}`, assignee:t.owner||null, due_date:today(), auto_generated:true}); }
    }
    if(creditRows.length){ const {error}=await db.from('supplier_credits').insert(creditRows); if(error)throw new Error('kreditnota: '+error.message); }

    // Kundens indbetaling (rekonstruktion) + refusion ud
    if($('#cx_bookpaid').checked && paid>0){
      const {data:pin,error:e1}=await db.from('payments').insert({direction:'ind',status:'betalt',amount:paid,currency:cur,fx_rate:1,amount_dkk:paid,bank_account:'(rekonstruktion)',method:'rekonstruktion',payment_ref:t.ref_no+'-IND',payment_date:today(),in_type:'delbetaling',note:'Rekonstrueret indbetaling ifm. afbestilling'}).select('id').single();
      if(e1)throw new Error('indbetaling: '+e1.message);
      await db.from('payment_allocations').insert({payment_id:pin.id,trip_id:id,amount_dkk:paid});
    }
    if(refund>0){
      const {data:pout,error:e2}=await db.from('payments').insert({direction:'ud',status:'aaben',amount:refund,currency:cur,fx_rate:1,amount_dkk:refund,bank_account:'',method:'refusion',payment_ref:t.ref_no+'-REF',payment_date:today(),in_type:'refund_til_kunde',note:'Refusion til kunde – afbestilling'}).select('id').single();
      if(e2)throw new Error('refusion: '+e2.message);
      await db.from('payment_allocations').insert({payment_id:pout.id,trip_id:id,amount_dkk:refund});
      taskRows.push({trip_id:id, task_type:'refusion_udbetaling', title:`Udbetal refusion til kunde: ${fmtKr(refund)} DKK`, assignee:t.owner||null, due_date:today(), auto_generated:true});
    }

async function saveEl(tripId, existingId){
  let supId = $('#e_sup').value || null;
  if(supId==='__ny'){
    const name=prompt('Leverandørens navn:'); if(!name) return;
    const type=prompt('Type (hotel_direkte / bedbank / konsolidator / transfer / andet):','hotel_direkte')||'andet';
    const {data:ns,error:se}=await db.from('suppliers').insert({name,supplier_type:type}).select('id').single();
    if(se){$('#elerr').textContent=se.message;return;}
    supId=ns.id;
  }
  const details={};
  document.querySelectorAll('#typefields [data-dk]').forEach(inp=>{if(inp.value!=='')details[inp.dataset.dk]=inp.type==='number'?Number(inp.value):inp.value;});
  let desc=$('#e_desc').value.trim();
  if(!desc&&details.flight_no) desc=`${details.airline||''} ${details.flight_no} ${details.dep||''} → ${details.arr||''}`.trim();
  if(!desc){$('#elerr').textContent='Giv elementet et navn.';return;}
  const payload={trip_id:tripId,element_type:$('#e_type').value,description:desc,status:$('#e_status').value,
    start_date:$('#e_start').value||null,end_date:$('#e_end').value||null,supplier_id:supId,financial_supplier_id:supId,
    vendor_due_date:$('#e_due').value||null,issue_deadline:$('#e_issue').value||null,
    buy_amount:$('#e_buy').value||null,buy_currency:$('#e_buy').value?$('#e_cur').value:null,details};
  const q = existingId?db.from('trip_elements').update(payload).eq('id',existingId):db.from('trip_elements').insert(payload);

  if(error){$('#elerr').textContent=error.message;return;}
  $('#eldlg').close(); viewTrip(tripId);
}

async function paxSave(tripId, travelerId){
  const err=document.getElementById('paxerr');
  const g=id=>{const e=document.getElementById(id);return e?String(e.value).trim():'';};
  const name=g('p_name'); if(!name){err.textContent='Rejsende skal have et navn.';return;}
  const lead=document.getElementById('p_lead').checked;
  const person={full_name:name, title:g('p_title')||null, date_of_birth:g('p_dob')||null,
    gender:g('p_gender')||null, nationality:g('p_nat').toUpperCase()||null, tshirt_size:g('p_tshirt')||null,
    email:g('p_email')||null, phone:g('p_phone')||null, passport_expiry:g('p_pexp')||null,
    allergies:g('p_all')||null, preferences:g('p_pref')||null, note:g('p_note')||null, is_lead:lead};
  let tid=travelerId;
  if(tid){
    const {error}=await db.from('travelers').update(person).eq('id',tid);
    if(error){err.textContent=error.message;return;}
    const {error:e2}=await db.from('trip_travelers').update({note:g('p_tnote')||null}).eq('trip_id',tripId).eq('traveler_id',tid);
    if(e2){err.textContent=e2.message;return;}
  } else {
    const cust=(window.TRIP||{}).customer_id;
    if(!cust){err.textContent='Kunne ikke finde rejsens kunde.';return;}
    person.customer_id=cust;
    const {data,error}=await db.from('travelers').insert(person).select('id').single();
    if(error){err.textContent=error.message;return;}
    tid=data.id;
    const {error:e3}=await db.from('trip_travelers').insert({trip_id:tripId,traveler_id:tid,note:g('p_tnote')||null});
    if(e3){err.textContent=e3.message;return;}
  }
  /* Kun én hovedrejsende pr. rejse */
  if(lead){
    const andre=(window.PAX||[]).filter(x=>x.id!==tid && x.is_lead).map(x=>x.id);
    if(andre.length) await db.from('travelers').update({is_lead:false}).in('id',andre);
  }
  const pno=String(document.getElementById('p_pno').value||'').trim();
  if(pno){
    const {error:pe}=await db.rpc('traveler_set_passport',{p_traveler:tid,p_no:pno});
    if(pe){err.textContent='Rejsende gemt, men pasnummeret kunne ikke krypteres: '+pe.message;return;}
  }
  document.getElementById('paxdlg').close(); viewTrip(tripId);
}
async function paxRemove(tripId, travelerId){
  const p=(window.PAX||[]).find(x=>x.id===travelerId);
  if(!confirm(`Fjern ${p?p.full_name:'den rejsende'} fra denne rejse?\n\nEr personen ikke med på andre rejser, slettes personen helt.`)) return;
  const {error}=await db.from('trip_travelers').delete().eq('trip_id',tripId).eq('traveler_id',travelerId);
  if(error){alert('Kunne ikke fjerne den rejsende: '+error.message);return;}
  const {count}=await db.from('trip_travelers').select('traveler_id',{count:'exact',head:true}).eq('traveler_id',travelerId);
  if(!count) await db.from('travelers').delete().eq('id',travelerId);
  viewTrip(tripId);
}

function calcPay(){

    $('#payrule').textContent=`Regel: ${days} dage til afrejse (>60) → depositum 50 % nu, rest senest ${bal}. Justér frit.`;}

async function saveTrip(){

    let custId=$('#n_cust').value;

    }
    if(!$('#n_dep').value) return err('Afrejsedato mangler.');
    let ref=$('#n_ref').value.trim();
    if(!ref){const {data:r,error:re}=await db.rpc('next_ref_no',{p_branch:$('#n_branch').value});if(re)return err(re.message);ref=r;}
    const travLines=$('#n_trav').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const {data:trip,error:te}=await db.from('trips').insert({
      ref_no:ref,branch:$('#n_branch').value,customer_id:custId,
      departure_date:$('#n_dep').value,return_date:$('#n_ret').value||null,
      pax_count:Math.max(travLines.length,1),customer_currency:$('#n_cur').value,
      package_sell_total:$('#n_price').value||null,
      deposit_amount:$('#n_depos').value||null,deposit_due:$('#n_deposdue').value||null,
      balance_due:$('#n_baldue').value||null,booking_date:today(),owner:window.ME
    }).select('id').single();
    if(te) return err(te.message);
    const dests=($('#n_dest').value||'Maldiverne').split(',').map(x=>x.trim()).filter(Boolean);
    await db.from('trip_destinations').insert(dests.map((d,i)=>({trip_id:trip.id,destination:d,seq:i+1})));
    for(const line of travLines){
      const [name,dob]=line.split('·').map(x=>x.trim());
      const {data:tv,error:tve}=await db.from('travelers').insert({customer_id:custId,full_name:name,date_of_birth:dob||null}).select('id').single();
      if(tve) return err('Rejsende: '+tve.message);
      await db.from('trip_travelers').insert({trip_id:trip.id,traveler_id:tv.id});
    }
    await afterTripFromLead(trip.id);
    viewTrip(trip.id);
  }catch(e){err(e.message);}
}

// ═══ SKOLEFERIER (DK + NO) ═══
// Fem ferier der reelt flytter priser og tilgængelighed: sommer, høst/efterår, jul, vinter, påske.
// Beregnes ud af ISO-ugenummer og påskedato, så det følger skoleåret år efter år uden vedligehold
// (juleferien går på tværs af nytår, og påsken flytter sig).
// Norge: høst- og vinterferie ligger forskelligt fra region til region. Regionen udledes af
// afrejselufthavnen. Kender vi den ikke, vises begge mulige uger — hellere et forbehold end et forkert svar.
function isoWeekNo(d){
  const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7)+3);
  const ft=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  ft.setUTCDate(ft.getUTCDate()-((ft.getUTCDay()+6)%7)+3);
  return 1+Math.round((t-ft)/604800000);
}
function easterSunday(y){ // Meeus/Jones/Butcher
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(y,mo-1,da));
}
// lufthavn → norsk region (koden i parentes i afrejselufthavn-feltet)
const NO_REGION={OSL:'ost',TRF:'ost',KRS:'ost',BGO:'vest',SVG:'vest',HAU:'vest',AES:'midt',TRD:'midt',BOO:'nord',TOS:'nord'};
// ferieuger pr. region — rettes her hvis en region viser sig at ligge anderledes
const FERIEUGER={
  'NO:ost' :{vinter:[8],  host:[40]},
  'NO:vest':{vinter:[9],  host:[41]},
  'NO:midt':{vinter:[9],  host:[40]},
  'NO:nord':{vinter:[9],  host:[40]},
  'NO:'    :{vinter:[8,9],host:[40,41]},   // ukendt region → begge muligheder
  'DK:'    :{vinter:[7,8],host:[42]}       // DK ligger ens på efterårsferien; vinterferien er uge 7 el. 8
};
function noRegion(airport){
  const m=/\(([A-Z]{3})\)/.exec(airport||''); return (m && NO_REGION[m[1]]) || '';
}
// hvilken af de fem ferier falder denne dag i?
function ferieDag(d,land,region){
  const y=d.getUTCFullYear(), mo=d.getUTCMonth()+1, da=d.getUTCDate(), w=isoWeekNo(d);
  const uger=FERIEUGER[land+':'+(land==='NO'?region:'')]||FERIEUGER[land+':'];
  // påske: fra lørdag før palmesøndag til 2. påskedag
  const dE=Math.round((d-easterSunday(y))/86400000);
  if(dE>=-8 && dE<=1) return {navn:'Påskeferie'};
  // juleferie: hen over nytår, samme skoleår
  if((mo===12&&da>=19)||(mo===1&&da<=3)) return {navn:'Juleferie'};
  if(uger.vinter.includes(w)) return {navn:'Vinterferie', uge:w};
  if(uger.host.includes(w))   return {navn: land==='NO'?'Høstferie':'Efterårsferie', uge:w};
  // sommerferie: NO uge 25–33, DK uge 26–32
  if(land==='NO' ? (w>=25&&w<=33) : (w>=26&&w<=32)) return {navn:'Sommerferie'};
  return null;
}
// hvilke ferier rammer rejsen? Vinduet udvides med én dag før afrejse og én efter hjemkomst.
function ferieForRejse(dep,ret,branch,airport){
  if(!dep) return [];
  const land = branch==='MD' ? 'DK' : 'NO';
  const region = land==='NO' ? noRegion(airport) : '';
  const d0=new Date(dep+'T00:00:00Z'); if(isNaN(d0)) return [];
  let d1 = ret? new Date(ret+'T00:00:00Z') : new Date(d0);
  if(isNaN(d1)||d1<d0) d1=new Date(d0);
  d0.setUTCDate(d0.getUTCDate()-1);   // dagen før afrejse
  d1.setUTCDate(d1.getUTCDate()+1);   // dagen efter hjemkomst
  const out=[];
  for(let i=0, d=new Date(d0); i<=62 && d<=d1; i++, d.setUTCDate(d.getUTCDate()+1)){
    const f=ferieDag(d,land,region); if(!f) continue;
    const lbl = f.uge ? f.navn+' uge '+f.uge : f.navn;
    if(!out.includes(lbl)) out.push(lbl);
  }
  return out;
}

function tnum(x){ return (x===null||x===undefined||x==='')?null:(+x); }
function parseBudgetFromText(t){
  if(!t) return null;
  const re=/((?:\d{1,3}[.\s]){1,3}\d{3}|\d{4,7})/g; let m, best=null, bestPP=false;
  while((m=re.exec(t))){
    const val=parseInt(m[1].replace(/[.\s]/g,''),10);
    if(isNaN(val)||val<5000||val>3000000) continue;
    const around=t.slice(Math.max(0,m.index-16), Math.min(t.length, re.lastIndex+20));
    if(!/kr|nok|dkk|kroner|budget|budsjett|maks|,-|per|pr\.?\s*person|pr\.?\s*pers/i.test(around)) continue;
    const pp=/pr\.?\s*person|per\s*person|per\s*pers|pr\s*pers|\/\s*person|\bpp\b|per hode/i.test(around);
    if(best==null || (pp&&!bestPP) || (pp===bestPP && val>best)){ best=val; bestPP=pp; }
  }
  return best==null?null:{amount:best, perPerson:bestPP};
}
function luxLevel(t){
  if(!t) return 'standard';
  if(/ultra|privat\s*pool|pool\s*villa|overwater|vandvilla|water\s*villa|eksklusiv|verdensklasse|5\s*\*\s*\*|ultimat/i.test(t)) return 'ultra';
  if(/luksus|luksuri|5\s*stjerner|5\s*\*|all\s*inclusive|romantisk|honeymoon|bryllup|premium/i.test(t)) return 'premium';
  return 'standard';
}
function triage(l){
  const pax=(tnum(l.adults)||0)+(tnum(l.kids)||0) || (tnum(l.adults)||0);
  const text=((l.wishes||'')+' '+(l.travel_wishes||'')+' '+(l.highlights||'')).toLowerCase();
  const pb=parseBudgetFromText(text);
  let perPerson=null,total=null,src=null;
  if(tnum(l.max_budget)!=null){ perPerson=+l.max_budget; src='felt: budget pr. person'; }
  else if(pb){ if(pb.perPerson){perPerson=pb.amount;} else {total=pb.amount;} src='læst i fritekst'; }
  else if(tnum(l.est_value)!=null){ total=+l.est_value; src='felt: budget (samlet)'; }
  if(perPerson==null && total!=null && pax>0) perPerson=Math.round(total/pax);
  if(total==null && perPerson!=null && pax>0) total=perPerson*pax;
  const tier = perPerson==null?null:(perPerson<20000?'low':perPerson<40000?'mid':'good');
  const lux=luxLevel(text);
  const kids=tnum(l.kids)||0;
  const musts=[
    ['navn', !!l.contact_name],
    ['e-mail/telefon', !!(l.contact_email||l.contact_phone)],
    ['afrejselufthavn', !!l.departure_airport],
    ['datoer', !!(l.earliest_departure||l.departure_date)],
    ['nætter', tnum(l.nights)!=null],
    ['rejsende', tnum(l.adults)!=null],
    ['børnealdre', !(kids>0) || !!l.child_ages],
    ['destination', destList(l.destination).length>0],
    ['budget', perPerson!=null||total!=null],
  ];
  const missing=musts.filter(m=>!m[1]).map(m=>m[0]);
  const completeness=Math.round(100*(musts.length-missing.length)/musts.length);
  let score=0;
  score += tier==='good'?40:tier==='mid'?25:tier==='low'?10:0;
  score += Math.round(completeness*0.2);
  score += lux==='ultra'?20:lux==='premium'?14:8;
  const nn=tnum(l.nights)||0; score += nn>=7?10:nn>=4?6:nn>=1?3:0;
  return {perPerson,total,tier,lux,pax,missing,complete:missing.length===0,completeness,score,src};
}

function normNavn(x){ return (x||'').toLowerCase().normalize('NFC').replace(/[^a-zæøåéèü ]/g,'').trim().replace(/\s+/g,' '); }
function markerGentagne(leads){
  const grænse = Date.now()-30*86400000;
  const byEmail={}, byNavn={};
  leads.forEach(l=>{
    const em=(l.contact_email||'').toLowerCase().trim();
    if(em && em.includes('@')){ (byEmail[em]=byEmail[em]||[]).push(l); }
    const nv=normNavn(l.contact_name);
    if(nv.includes(' ')){ (byNavn[nv]=byNavn[nv]||[]).push(l); }
  });
  leads.forEach(l=>{
    const em=(l.contact_email||'').toLowerCase().trim(), nv=normNavn(l.contact_name);
    const flok = (em && em.includes('@') && byEmail[em]) || (nv.includes(' ') && byNavn[nv]) || [l];
    // andre henvendelser fra samme person, oprettet inden for 30 dage
    const nye = flok.filter(o=>o.id!==l.id && o.created_at && new Date(o.created_at).getTime()>=grænse);
    if(!nye.length){ l._gentag=null; return; }
    const seneste = nye.map(o=>daysSince(o.created_at)).sort((a,b)=>a-b)[0];
    l._gentag={antal:nye.length, dage:seneste};
  });
}

   DASHBOARDETS INDSIGTER
   Alt regnes live paa de rejser og henvendelser dashboardet allerede har hentet.
   Hver indsigt har en FORM — soejler, ring, maanedskolonner eller stort tal —

/* En personlig linje til den der er logget ind — regnet paa vedkommendes egne rejser.
   Ikke et citat: noget der anerkender indsatsen med tal der er ens egne. */
function personligLinje(trips){
  const me=window.ME, navn=window.MYNAME||'';
  const ok=(trips||[]).filter(t=>!['canx','voided'].includes(t.status) && !/^test/i.test(t.ref_no||''));
  const mine=ok.filter(t=>t.owner===me);
  if(!me || mine.length<3) return null;
  const kr=n=>Math.round(n||0).toLocaleString('da-DK');
  const aar=String(new Date().getFullYear());
  const iaar=mine.filter(t=>t.booking_date&&t.booking_date.slice(0,4)===aar);
  const sidsteAar=mine.filter(t=>t.booking_date&&t.booking_date.slice(0,4)===String(+aar-1));
  const idag=new Date().toISOString().slice(0,10).slice(5);
  const sidsteAarHertil=sidsteAar.filter(t=>t.booking_date.slice(5)<=idag);
  const gaester=t=>t.reduce((s,x)=>s+(x.pax_count||0),0);
  const oms=t=>t.reduce((s,x)=>s+ +(x.package_sell_dkk||0),0);
  const naetter=t=>t.reduce((s,x)=>s+(x.return_date&&x.departure_date?
    Math.max(0,Math.round((new Date(x.return_date)-new Date(x.departure_date))/86400000)):0),0);
  const L=[];
  /* Hver linje skal definere sit eget tal: hvad maales, paa hvilke rejser, og i hvilken periode. */
  const P1=`rejser du selv har booket`;

  if(iaar.length>=3){
    L.push(`<b>${iaar.length} rejser</b> har du booket i år — ${kr(gaester(iaar))} gæster. <em>Målt på bookingdato, 1. januar til i dag.</em>`);
    const dage=Math.max(1,Math.round((new Date()-new Date(aar+'-01-01'))/86400000));
    L.push(`<b>${kr(oms(iaar))} kr.</b> har du solgt for i år. Det er ${kr(oms(iaar)/dage)} kr. i snit pr. dag. <em>Salgspris på ${P1}, 1. januar til i dag.</em>`);
  }
  if(iaar.length>=3 && sidsteAarHertil.length>=3){
    const d=oms(iaar)-oms(sidsteAarHertil);
    const p=Math.round(100*Math.abs(d)/Math.max(1,oms(sidsteAarHertil)));
    L.push(`Du er <b>${p} % ${d>=0?'foran':'efter'}</b> sidste år: ${kr(oms(iaar))} kr. mod ${kr(oms(sidsteAarHertil))} kr. `
      +`<em>Salgspris på ${P1}, 1. januar til ${new Date().toLocaleDateString('da-DK',{day:'numeric',month:'long'})} — begge år.</em>`);
  }
  if(mine.length>=10){
    L.push(`I alt har du sendt <b>${kr(gaester(mine))} gæster</b> afsted på ${mine.length} rejser. <em>Alle ${P1}, så langt data rækker.</em>`);
  }
  const sidste=mine.filter(t=>t.booking_date).sort((a,b)=>b.booking_date.localeCompare(a.booking_date))[0];
  if(sidste){
    const d=Math.round((new Date()-new Date(sidste.booking_date))/86400000);
    if(d<=14) L.push(d===0?`Du lukkede en rejse i dag: <b>${escH(sidste.ref_no)}</b>. Godt gået.`
                     :`Din seneste booking var for <b>${d} dag${d===1?'':'e'}</b> siden: ${escH(sidste.ref_no)}.`);
  }
  const stoerst=mine.filter(t=>+t.package_sell_dkk>0).sort((a,b)=>b.package_sell_dkk-a.package_sell_dkk)[0];
  if(stoerst) L.push(`Din største rejse er <b>${escH(stoerst.ref_no)}</b> til ${kr(stoerst.package_sell_dkk)} kr. for ${stoerst.pax_count} rejsende. <em>Salgspris, alle år.</em>`);
  if(!L.length) return null;
  return L[Math.floor(Math.random()*L.length)];
}

function byggIndsigter(trips, leads){
  const ok  = (trips||[]).filter(t=>!['canx','voided'].includes(t.status) && !/^test/i.test(t.ref_no||''));
  const pris= ok.filter(t=>+t.package_sell_dkk>0);
  const ud=[];
  /* Perioden opgoeres kun paa aar med reelt volumen — et aar med en haandfuld rejser
     er starten paa et datasaet, ikke et aar, og skal ikke faa grafen til at se skaev ud. */
  const aarTal={}; ok.forEach(t=>{ if(t.booking_date) aarTal[t.booking_date.slice(0,4)]=(aarTal[t.booking_date.slice(0,4)]||0)+1; });
  const rigtige=Object.keys(aarTal).filter(a=>aarTal[a]>=20).sort();
  const foersteAar=rigtige[0]||Object.keys(aarTal).sort()[0];
  const sidsteAar=rigtige[rigtige.length-1]||foersteAar;
  const HELE = foersteAar&&foersteAar!==sidsteAar ? `${foersteAar}–${sidsteAar}` : (sidsteAar||'alle år');
  /* Hvert kort paa dashboardet har sin egen rolle, og hver indsigt hoerer til ét af dem:
       pers  = kort 1, om den der er logget ind
       nu    = kort 2, den periode vi staar midt i (i dag, denne uge, denne maaned, i aar)
       total = kort 3, hele historikken samlet
       sjov  = kort 4, rekorder og kuriositeter                                        */
  const P =(form,titel,periode,l,e,g)=>ud.push({form,titel,periode,l,e,g,kat:'total'});
  const PN=(form,titel,periode,l,e,g)=>ud.push({form,titel,periode,l,e,g,kat:'nu'});
  const PS=(form,titel,periode,l,e,g)=>ud.push({form,titel,periode,l,e,g,kat:'sjov'});
  const PP=(form,titel,periode,l,e,g)=>ud.push({form,titel,periode,l,e,g,personlig:true,kat:'pers'});
  const mine = ok.filter(t=>t.owner===window.ME);
  const minePris = mine.filter(t=>+t.package_sell_dkk>0);
  const aarNu = String(new Date().getFullYear());
  const gaesterAf=a=>a.reduce((s,x)=>s+(x.pax_count||0),0);
  const omsAf=a=>a.reduce((s,x)=>s+ +(x.package_sell_dkk||0),0);
  const naetterAf=a=>a.reduce((s,x)=>s+(x.return_date&&x.departure_date?
    Math.max(0,Math.round((new Date(x.return_date)-new Date(x.departure_date))/86400000)):0),0);

  /* 1 · gengangere — hvad der FAKTISK er interessant */
  (()=>{ const pr={};
    pris.forEach(t=>{ if(!t.customer_id) return; const g=pr[t.customer_id]=pr[t.customer_id]||{n:0,sum:0,pax:0,d:[]};
      g.n++; g.sum+=+t.package_sell_dkk; g.pax+=(t.pax_count||0); if(t.departure_date) g.d.push(t.departure_date); });
    const g=Object.values(pr); if(g.length<50) return;
    const en=g.filter(x=>x.n===1), to=g.filter(x=>x.n===2), tre=g.filter(x=>x.n>=3);
    if(!to.length||!tre.length) return;
    const prRejse=a=>a.reduce((s,x)=>s+x.sum/x.n,0)/a.length;
    const mellem=a=>{ const v=a.filter(x=>x.d.length>1).map(x=>{ const s=x.d.slice().sort();
      return (new Date(s[s.length-1])-new Date(s[0]))/86400000/(x.d.length-1); });
      return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; };
    const m2=mellem(to), m3=mellem(tre);
    const mx=Math.max(prRejse(en),prRejse(to),prRejse(tre));
    P('bars','Gengangeren',HELE,
      `Gengangeren betaler <b>det samme</b> pr. rejse — det er den tredje rejse der rykker.`,
      `En kunde der har rejst to gange, betaler stort set det samme pr. rejse som en førstegangskunde. Først fra tredje rejse stiger beløbet — og de rejser i større selskab. `+
      (m2?`Til gengæld ved vi hvornår de kommer igen: der går i snit ${Math.round(m2/30)} måneder mellem to rejser.`:''),
      fBars([['Første rejse',`${kr0(prRejse(en))} kr. <em>· ${en.length} kunder</em>`,Math.round(100*prRejse(en)/mx)],
             ['Har rejst 2 gange',`${kr0(prRejse(to))} kr. <em>· ${to.length} kunder</em>`,Math.round(100*prRejse(to)/mx)],
             ['Har rejst 3+ gange',`${kr0(prRejse(tre))} kr. <em>· ${tre.length} kunder</em>`,Math.round(100*prRejse(tre)/mx),'alt']]),
      `Gennemsnitspris pr. rejse, ikke samlet forbrug. ${g.length} kunder.`);
  })();

  /* 2 · hvornaar de vender tilbage */
  (()=>{ const pr={};
    ok.forEach(t=>{ if(!t.customer_id||!t.departure_date) return;
      (pr[t.customer_id]=pr[t.customer_id]||[]).push(t.departure_date); });
    const gaps=[]; Object.values(pr).forEach(d=>{ if(d.length<2) return; const s=d.slice().sort();
      for(let i=1;i<s.length;i++) gaps.push((new Date(s[i])-new Date(s[i-1]))/86400000); });
    if(gaps.length<10) return;
    const spand=[['Under 1 år',d=>d<365],['1–2 år',d=>d>=365&&d<730],['2–3 år',d=>d>=730&&d<1095],['Over 3 år',d=>d>=1095]];
    const r=spand.map(([n,f])=>[n,gaps.filter(f).length]).filter(x=>x[1]);
    const top=r.reduce((a,x)=>x[1]>a[1]?x:a);
    const snit=Math.round(gaps.reduce((s,x)=>s+x,0)/gaps.length);
    P('kolonner','Hvornår de vender tilbage',HELE,
      `De kommer igen efter <b>${Math.round(snit/30)} måneder</b>.`,
      `Når en kunde først vender tilbage, sker det oftest ${top[0].toLowerCase()} efter sidste rejse. Det er dér en henvendelse fra jer rammer bedst.`,
      fKol(r, top[0]),
      `${gaps.length} gentagne rejser fra ${Object.values(pr).filter(d=>d.length>1).length} kunder.`);
  })();

  /* 3 · hvor tidligt de booker */
  (()=>{ const b=pris.filter(t=>t.booking_date&&t.departure_date); if(b.length<50) return;
    const dg=t=>Math.round((new Date(t.departure_date)-new Date(t.booking_date))/86400000);
    const spand=[['Under 1 md.',d=>d<30],['1–3 md.',d=>d>=30&&d<90],['3–6 md.',d=>d>=90&&d<180],
                 ['6–12 md.',d=>d>=180&&d<365],['Over 1 år',d=>d>=365]];
    const r=spand.map(([n,f])=>{ const g=b.filter(t=>f(dg(t)));
      return {n,c:g.length,pris:g.length?g.reduce((s,t)=>s+ +t.package_sell_dkk,0)/g.length:0,
              pax:g.length?g.reduce((s,t)=>s+(t.pax_count||0),0)/g.length:0}; }).filter(x=>x.c>5);
    if(r.length<3) return; const mx=Math.max(...r.map(x=>x.pris));
    P('bars','Hvor tidligt de booker',HELE,
      `Jo tidligere kunden booker, jo <b>større</b> bliver rejsen.`,
      `Det stiger hele vejen — og selskabet vokser med, fra ${r[0].pax.toFixed(1)} til ${r[r.length-1].pax.toFixed(1)} rejsende.`,

  /* ── PERSONLIGE ── */
  (()=>{ const iaar=mine.filter(t=>t.booking_date&&t.booking_date.slice(0,4)===aarNu);

  (()=>{ const iaar=mine.filter(t=>t.booking_date&&t.booking_date.slice(0,4)===aarNu);

    const r=fulde.map(a=>[a,Math.round(g[a].sum/1000000*10)/10]);
    const bedst=r.reduce((a,x)=>x[1]>a[1]?x:a);
    P('kolonner','År for år',fulde[0]+'–'+fulde[fulde.length-1],
      `<b>${bedst[0]}</b> er jeres bedste år — ${bedst[1]} mio. kr.`,
      `Salgspris på alle bookede rejser, år for år. Kun år med mindst 20 rejser er med, så en halv sæson ikke ligner et fald.`,
      fKol(r, bedst[0]));
  })();

  /* aflysninger */
  (()=>{ const alle=(trips||[]).filter(t=>!/^test/i.test(t.ref_no||''));
    const canx=alle.filter(t=>t.status==='canx'); if(canx.length<5||alle.length<100) return;
    const pct=100*canx.length/alle.length;
    P('ring','Aflysninger',HELE,
      `<b>${pct.toFixed(1)} %</b> af rejserne bliver aflyst.`,
      `${canx.length} aflyste ud af ${alle.length} bookede rejser i alt. Resten er gennemført eller på vej.`,
      fRing(pct, canx.length+'', 'aflyste rejser',
        [['Gennemført eller undervejs',alle.length-canx.length,'alt'],['Aflyst',canx.length,'']]));
  })();

  /* pipeline: hvad er booket frem i tiden */
  (()=>{ const idag=new Date().toISOString().slice(0,10);
    const frem=pris.filter(t=>t.departure_date>idag); if(frem.length<10) return;
    const sum=frem.reduce((s,t)=>s+ +t.package_sell_dkk,0);
    const g={}; frem.forEach(t=>{ const m=t.departure_date.slice(0,7); g[m]=(g[m]||0)+1; });
    const r=Object.entries(g).sort().slice(0,8).map(([m,c])=>[m.slice(5)+'/'+m.slice(2,4),c]);
    const top=r.reduce((a,x)=>x[1]>a[1]?x:a);
    PN('kolonner','Booket frem i tiden','fra i dag',
      `<b>${frem.length} rejser</b> venter på at komme afsted.`,
      `${kr0(sum)} kr. i salgspris er allerede booket, men ikke rejst endnu. Fordelt på afrejsemåned.`,
      fKol(r, top[0]));
  })();

  /* hvor mange er ude samtidig */
  (()=>{ const b=ok.filter(t=>t.departure_date&&t.return_date); if(b.length<50) return;
    const g={}; b.forEach(t=>{ const m=t.departure_date.slice(0,7); g[m]=(g[m]||0)+(t.pax_count||0); });
    const r=Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const mx=r[0][1];
    P('bars','Travleste måneder',HELE,
      `<b>${r[0][0]}</b> var måneden med flest gæster afsted.`,
      `${r[0][1]} gæster rejste ud i den måned. Her er de fem travleste måneder I har haft.`,
      fBars(r.map((x,i)=>[x[0],`${x[1]} gæster`,Math.round(100*x[1]/mx),i===0?'alt':''])));
  })();

  /* prisspaend */
  (()=>{ const b=pris.slice().sort((a,b)=>a.package_sell_dkk-b.package_sell_dkk); if(b.length<50) return;
    const med=b[Math.floor(b.length/2)].package_sell_dkk;
    const sp=[['Under 50.000',p=>p<50000],['50–100.000',p=>p>=50000&&p<100000],
              ['100–150.000',p=>p>=100000&&p<150000],['Over 150.000',p=>p>=150000]];
    const r=sp.map(([n,f])=>[n,b.filter(t=>f(+t.package_sell_dkk)).length]).filter(x=>x[1]);
    const mx=Math.max(...r.map(x=>x[1])); const top=r.reduce((a,x)=>x[1]>a[1]?x:a);
    P('bars','Prisspændet',HELE,
      `Halvdelen af rejserne koster over <b>${kr0(med)} kr.</b>`,
      `Medianen er ${kr0(med)} kr. — den dyreste rejse I har solgt er ${kr0(b[b.length-1].package_sell_dkk)} kr., den billigste ${kr0(b[0].package_sell_dkk)}.`,
      fBars(r.map(x=>[x[0],`${x[1]} rejser`,Math.round(100*x[1]/mx),x===top?'alt':''])));
  })();

  /* boernefamilier */
  (()=>{ const b=pris.filter(t=>t.pax_count>0); if(b.length<50) return;
    const par=b.filter(t=>t.pax_count===2), familie=b.filter(t=>t.pax_count>=3);
    if(!par.length||!familie.length) return;
    const snit=a=>a.reduce((s,t)=>s+ +t.package_sell_dkk,0)/a.length;
    const mx=Math.max(snit(par),snit(familie));
    P('bars','Par eller familie',HELE,
      `<b>${Math.round(100*par.length/b.length)} %</b> af rejserne er to personer.`,
      `Parret er jeres typiske kunde. Familien fylder mindre i antal, men mere i kroner — ${kr0(snit(familie))} kr. mod ${kr0(snit(par))}.`,
      fBars([['To personer',`${par.length} rejser <em>· ${kr0(snit(par))} kr.</em>`,Math.round(100*snit(par)/mx)],
             ['Tre eller flere',`${familie.length} rejser <em>· ${kr0(snit(familie))} kr.</em>`,Math.round(100*snit(familie)/mx),'alt']]));
  })();

  /* hvor lang tid en henvendelse tager */
  (()=>{ if(!leads||leads.length<50) return;
    const g={}; leads.forEach(l=>{ const m=(l.created_at||'').slice(0,7); if(m) g[m]=(g[m]||0)+1; });
    const r=Object.entries(g).sort().slice(-8).map(([m,c])=>[m.slice(5)+'/'+m.slice(2,4),c]);
    if(r.length<3) return; const top=r.reduce((a,x)=>x[1]>a[1]?x:a);
    PN('kolonner','Henvendelser pr. måned','seneste måneder',
      `<b>${top[1]} henvendelser</b> i ${top[0]} — jeres bedste måned.`,
      `Antal henvendelser modtaget pr. måned. Det er toppen af tragten: alt hvad der senere bliver til rejser, starter her.`,
      fKol(r, top[0]));
  })();

  /* ══ FLERE PERSONLIGE ══ */
  (()=>{ if(minePris.length<10) return;
    const minSnit=omsAf(minePris)/minePris.length;
    const holdet=pris.filter(t=>t.owner&&t.owner!==window.ME);
    if(holdet.length<10) return;
    const holdSnit=omsAf(holdet)/holdet.length;
    const mx=Math.max(minSnit,holdSnit);
    PP('bars','Din gennemsnitsrejse','i alt',
      `Din gennemsnitsrejse er <b>${kr0(minSnit)} kr.</b>`,
      `Målt på salgspris over ${minePris.length} rejser du selv har booket. Resten af holdet ligger på ${kr0(holdSnit)} kr. over ${holdet.length} rejser.`,
      fBars([['Dig',`${kr0(minSnit)} kr. <em>· ${minePris.length} rejser</em>`,Math.round(100*minSnit/mx),'alt'],
             ['Resten af holdet',`${kr0(holdSnit)} kr. <em>· ${holdet.length} rejser</em>`,Math.round(100*holdSnit/mx)]]));
  })();

  (()=>{ if(mine.length<10) return;
    const g={}; mine.forEach(t=>destAf(t).forEach(d=>{ g[d]=(g[d]||0)+1; }));
    const r=topListe(g,5); if(r.length<2) return; const mx=r[0][1];
    PP('bars','Dine destinationer','i alt',
      `Du sælger mest til <b>${r[0][0]}</b>.`,
      `${r[0][1]} af dine ${mine.length} rejser går dertil. Her er de fem du sender flest til.`,
      fBars(r.map((x,i)=>[x[0],`${x[1]} rejser`,Math.round(100*x[1]/mx),i===0?'alt':''])));
  })();

  (()=>{ const alle=pris.filter(t=>t.owner); if(alle.length<20||!minePris.length) return;
    const g={}; alle.forEach(t=>{ g[t.owner]=(g[t.owner]||0)+ +t.package_sell_dkk; });
    const total=Object.values(g).reduce((s,x)=>s+x,0);
    const min=g[window.ME]||0; if(!min) return;
    PP('ring','Din andel','i alt',
      `Du står for <b>${Math.round(100*min/total)} %</b> af alt salg.`,
      `Målt på salgspris over alle rejser med en ansvarlig. Det er ${kr0(min)} kr. af ${kr0(total)} kr.`,
      fRing(Math.round(100*min/total), Math.round(100*min/total)+' %','af holdets salg',
        Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([o,v])=>[o===window.ME?'Dig':o,kr0(v/1000)+' t.kr.',o===window.ME?'alt':''])));
  })();

  (()=>{ if(minePris.length<10) return;
    const nat=minePris.map(t=>natAf(t)).filter(n=>n);
    if(nat.length<10) return;
    const snit=nat.reduce((s,x)=>s+x,0)/nat.length;
    const laengst=minePris.filter(t=>natAf(t)).sort((a,b)=>natAf(b)-natAf(a))[0];
    PP('tal','Dine nætter','i alt',
      `Du har solgt <b>${kr0(naetterAf(mine))} nætter</b>.`,
      `Gennemsnitligt ${snit.toFixed(1)} nætter pr. rejse. Din længste er ${escH(laengst.ref_no)} med ${natAf(laengst)} nætter.`,
      fTal(kr0(naetterAf(mine)),'nætter','du har solgt i alt',
        [['rejser',mine.length],['snit',snit.toFixed(1)+' nætter'],['længste',natAf(laengst)+' nætter']]));
  })();

  (()=>{ const iaar=minePris.filter(t=>t.booking_date&&t.booking_date.slice(0,4)===aarNu);
    if(iaar.length<5) return;
    const D=['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
    const r=[1,2,3,4,5,6,0].map(d=>[D[d],iaar.filter(t=>new Date(t.booking_date).getDay()===d).length]).filter(x=>x[1]);
    if(r.length<3) return; const top=r.reduce((a,x)=>x[1]>a[1]?x:a);
    PP('kolonner','Din bedste ugedag',aarNu,
      `Du lukker flest rejser om <b>${top[0].toLowerCase()}en</b>.`,
      `${top[1]} af dine ${iaar.length} bookinger i år faldt på en ${top[0].toLowerCase()}.`,
      fKol(r, top[0]));
  })();

  (()=>{ if(mine.length<20) return;
    const g={}; mine.forEach(t=>{ if(!t.booking_date) return;
      const a=t.booking_date.slice(0,4); (g[a]=g[a]||{c:0,sum:0}).c++; g[a].sum+= +(t.package_sell_dkk||0); });
    const aar=Object.keys(g).sort().filter(a=>g[a].c>=5);
    if(aar.length<3) return;
    const r=aar.map(a=>[a,g[a].c]);
    const bedst=r.reduce((a,x)=>x[1]>a[1]?x:a);
    PP('kolonner','Dit bedste år',aar[0]+'–'+aar[aar.length-1],
      `<b>${bedst[0]}</b> var dit stærkeste år — ${bedst[1]} rejser.`,
      `Antal rejser du selv har booket, år for år. Kun år med mindst fem bookinger er med.`,
      fKol(r, bedst[0]));
  })();

  (()=>{ const g=new Date(Date.now()-90*86400000).toISOString().slice(0,10);
    const nye=minePris.filter(t=>t.booking_date&&t.booking_date>=g); if(nye.length<3) return;
    PP('tal','Dit seneste kvartal','seneste 90 dage',
      `<b>${nye.length} rejser</b> på 90 dage.`,
      `${kr0(omsAf(nye))} kr. i salgspris og ${gaesterAf(nye)} gæster — rejser du selv har booket de seneste tre måneder.`,
      fTal(kr0(omsAf(nye)/1000),'t.kr.','solgt på 90 dage',
        [['rejser',nye.length],['gæster',gaesterAf(nye)],['pr. uge',(nye.length/13).toFixed(1)]]));
  })();


  /* ══════════════════════════════════════════════════════════════════
     KORT 2 · AKTUELT — det korte lys: i dag, denne uge, denne maaned, i aar.
     Alt herunder maales paa en periode vi staar midt i, saa tallet foelger
     med virkeligheden fra dag til dag.
     ══════════════════════════════════════════════════════════════════ */
  const IDAG=new Date(), IS=d=>new Date(d).toISOString().slice(0,10);
  const T0=IS(IDAG), AAR=IDAG.getFullYear(), MDR=IDAG.getMonth(), DAG=IDAG.getDate();
  const MN=['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
  const stor=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const p2=n=>String(n).padStart(2,'0');
  const plusDage=n=>IS(new Date(IDAG.getTime()+n*86400000));
  const bookI=(fra,til)=>pris.filter(t=>t.booking_date&&t.booking_date>=fra&&t.booking_date<=til);
  const rejserI=(fra,til)=>ok.filter(t=>t.departure_date&&t.departure_date>=fra&&t.departure_date<=til);

  /* denne maaned mod samme dage sidste aar */
  (()=>{ const nu=bookI(`${AAR}-${p2(MDR+1)}-01`,T0);
    const fjor=bookI(`${AAR-1}-${p2(MDR+1)}-01`,`${AAR-1}-${p2(MDR+1)}-${p2(DAG)}`);
    if(nu.length+fjor.length<4) return;
    const a=omsAf(nu), b=omsAf(fjor), mx=Math.max(a,b,1);
    const pct=b?Math.round(100*(a-b)/b):null;
    PN('bars',`${stor(MN[MDR])} indtil nu`,`1.–${DAG}. ${MN[MDR]}`,
      pct===null?`I har solgt for <b>${kr0(a)} kr.</b> i denne måned.`
        :pct>=0?`I er <b>${pct} %</b> foran samme dage sidste år.`
               :`I ligger <b>${Math.abs(pct)} %</b> under samme dage sidste år.`,
      `Salgspris på rejser booket 1.–${DAG}. ${MN[MDR]}, holdt op mod de samme datoer i ${AAR-1}. Hele holdet, begge brancher.`,
      fBars([[`${MN[MDR]} ${AAR}`,`${kr0(a)} kr. <em>· ${nu.length} rejser</em>`,Math.round(100*a/mx),'alt'],
             [`${MN[MDR]} ${AAR-1}`,`${kr0(b)} kr. <em>· ${fjor.length} rejser</em>`,Math.round(100*b/mx)]]));
  })();

  /* aaret indtil i dag mod sidste aar samme dato */
  (()=>{ const nu=bookI(`${AAR}-01-01`,T0), fjor=bookI(`${AAR-1}-01-01`,`${AAR-1}-${p2(MDR+1)}-${p2(DAG)}`);
    if(nu.length<5||fjor.length<5) return;
    const a=omsAf(nu), b=omsAf(fjor), mx=Math.max(a,b,1), pct=Math.round(100*(a-b)/b);
    PN('bars','Året indtil i dag',`1. januar – ${DAG}. ${MN[MDR]}`,
      pct>=0?`I har solgt for <b>${kr0(a-b)} kr. mere</b> end på samme dag sidste år.`
            :`I mangler <b>${kr0(b-a)} kr.</b> for at nå sidste års tempo.`,
      `Salgspris på alle rejser booket fra 1. januar til i dag, sammenlignet med 1. januar – ${DAG}. ${MN[MDR]} ${AAR-1}. Hele holdet.`,
      fBars([[`${AAR}`,`${kr0(a)} kr. <em>· ${nu.length} rejser</em>`,Math.round(100*a/mx),'alt'],
             [`${AAR-1}`,`${kr0(b)} kr. <em>· ${fjor.length} rejser</em>`,Math.round(100*b/mx)]]));
  })();

  /* de naeste 30 dage — hvem der skal afsted */
  (()=>{ const u=rejserI(T0,plusDage(30)); if(!u.length) return;
    const g=gaesterAf(u), v=omsAf(u.filter(t=>+t.package_sell_dkk>0));
    const uge=rejserI(T0,plusDage(7)), hjem=ok.filter(t=>t.return_date&&t.return_date>=T0&&t.return_date<=plusDage(30));
    PN('tal','De næste 30 dage','fra i dag',
      `<b>${g}</b> gæster skal afsted inden for en måned.`,
      `Alle rejser med afrejse fra i dag til ${DAG}. om 30 dage — uanset hvem der har solgt dem. Værdien er salgsprisen på de rejser.`,
      fTal(kr0(g),g===1?'gæst':'gæster',`fordelt på ${u.length} ${u.length===1?'rejse':'rejser'} til ${kr0(v)} kr.`,
        [['afrejser inden for 7 dage',uge.length],['hjemrejser i perioden',hjem.length]]));
  })();

  /* denne uge — den helt korte horisont */
  (()=>{ const ud=rejserI(T0,plusDage(7)), hjem=ok.filter(t=>t.return_date&&t.return_date>=T0&&t.return_date<=plusDage(7));
    const ude=ok.filter(t=>t.departure_date&&t.departure_date<=T0&&(t.return_date||t.departure_date)>=T0&&t.status!=='faerdig');
    if(!ud.length&&!hjem.length&&!ude.length) return;
    PN('tal','Denne uge','de næste 7 dage',
      ude.length?`<b>${gaesterAf(ude)}</b> af jeres gæster er ude lige nu.`:`Ingen gæster er ude lige nu.`,
      `Ude nu = rejser hvor afrejsen er passeret og hjemrejsen ikke er nået. De to øvrige tal tæller afrejser og hjemrejser fra i dag og syv dage frem.`,
      fTal(String(gaesterAf(ude)),gaesterAf(ude)===1?'gæst ude':'gæster ude',
        `${ude.length} ${ude.length===1?'rejse':'rejser'} i luften lige nu`,
        [['afrejser i ugen',ud.length],['hjemrejser i ugen',hjem.length]]));
  })();

  /* dette kvartal mod forrige */
  (()=>{ const q=Math.floor(MDR/3), qFra=`${AAR}-${p2(q*3+1)}-01`;
    const fq=q===0?{a:AAR-1,m:9}:{a:AAR,m:(q-1)*3};
    const nu=bookI(qFra,T0), foer=bookI(`${fq.a}-${p2(fq.m+1)}-01`,IS(new Date(fq.a,fq.m+3,0)));
    if(nu.length<3||foer.length<3) return;
    const a=omsAf(nu), b=omsAf(foer), mx=Math.max(a,b,1);
    PN('bars',`Q${q+1} indtil nu`,`${MN[q*3]}–${MN[q*3+2]}`,
      `I har lagt <b>${kr0(a)} kr.</b> i kvartalet indtil videre.`,
      `Salgspris på rejser booket i det kvartal vi står i, mod hele det forrige kvartal. Det nuværende kvartal er ikke færdigt endnu, så søjlen vokser stadig.`,
      fBars([[`Q${q+1} ${AAR}`,`${kr0(a)} kr. <em>· ${nu.length} rejser</em>`,Math.round(100*a/mx),'alt'],
             [`Q${fq.m/3+1} ${fq.a} · helt`,`${kr0(b)} kr. <em>· ${foer.length} rejser</em>`,Math.round(100*b/mx)]]));
  })();

  /* de seneste syv dage — nye henvendelser */
  (()=>{ if(!leads||leads.length<20) return;
    const f7=plusDage(-7), f14=plusDage(-14);
    const nye=leads.filter(l=>l.created_at&&l.created_at.slice(0,10)>=f7);
    const foer=leads.filter(l=>l.created_at&&l.created_at.slice(0,10)>=f14&&l.created_at.slice(0,10)<f7);
    if(!nye.length&&!foer.length) return;
    const mx=Math.max(nye.length,foer.length,1);
    PN('bars','Nye henvendelser','de seneste 7 dage',
      nye.length?`<b>${nye.length}</b> ${nye.length===1?'ny henvendelse':'nye henvendelser'} er landet på en uge.`:`Der er ikke kommet nye henvendelser den seneste uge.`,
      `Antal henvendelser oprettet de seneste syv dage, holdt op mod de syv dage før. Hele holdet, begge brancher.`,
      fBars([['Seneste 7 dage',`${nye.length} stk.`,Math.round(100*nye.length/mx),'alt'],
             ['Ugen før',`${foer.length} stk.`,Math.round(100*foer.length/mx)]]));
  })();

  /* maaneden der gik mod maaneden foer den */
  (()=>{ const a30=bookI(plusDage(-30),T0), b30=bookI(plusDage(-60),plusDage(-31));
    if(a30.length<3&&b30.length<3) return;
    const a=omsAf(a30), b=omsAf(b30), mx=Math.max(a,b,1);
    PN('bars','Måneden der gik','seneste 30 dage',
      a>=b?`Salget er <b>steget</b> mod de 30 dage før.`:`Salget er <b>faldet</b> mod de 30 dage før.`,
      `Rullende 30 dage: alt booket de seneste 30 dage mod de 30 dage lige før. Ikke kalendermåneder — så tallet flytter sig hver dag.`,
      fBars([['Seneste 30 dage',`${kr0(a)} kr. <em>· ${a30.length} rejser</em>`,Math.round(100*a/mx),'alt'],
             ['De 30 dage før',`${kr0(b)} kr. <em>· ${b30.length} rejser</em>`,Math.round(100*b/mx)]]));
  })();

  /* aarets maaneder indtil nu */
  (()=>{ const iaar=bookI(`${AAR}-01-01`,T0); if(iaar.length<12) return;
    const pr={}; iaar.forEach(t=>{ const m=+t.booking_date.slice(5,7)-1; pr[m]=(pr[m]||0)+1; });
    const r=Object.keys(pr).map(m=>[stor(MN[+m]).slice(0,3),pr[m]]);
    const top=r.reduce((a,x)=>x[1]>a[1]?x:a);
    PN('kolonner',`Sådan er ${AAR} gået`,`januar – ${MN[MDR]}`,
      `<b>${top[0]}</b> har været årets travleste måned indtil videre.`,
      `Antal rejser booket pr. måned i år. Tæller bookingdatoen, ikke afrejsen — altså hvornår salget faldt på plads.`,
      fKol(r,top[0]));
  })();

  /* ══════════════════════════════════════════════════════════════════
     KORT 4 · SJOVT AT VIDE — rekorder og kuriositeter fra hele historikken.
     Ikke noget man styrer efter. Noget man fortaeller videre.
     ══════════════════════════════════════════════════════════════════ */
  const nat1=t=>t.return_date&&t.departure_date?Math.max(0,Math.round((new Date(t.return_date)-new Date(t.departure_date))/86400000)):0;

  /* gaestenaetter i alt */
  (()=>{ const gn=ok.reduce((s,t)=>s+nat1(t)*(t.pax_count||0),0); if(gn<500) return;
    const aar=(gn/365).toFixed(0);
    PS('tal','Nætter under palmerne','alt hvad I har solgt',
      `Jeres gæster har sovet <b>${kr0(gn)} nætter</b> i Det Indiske Ocean.`,
      `Antal nætter gange antal rejsende, lagt sammen for hver eneste rejse I har solgt. Én person i én nat tæller som én.`,
      fTal(kr0(gn),'gæstenætter',`det svarer til ${aar} år i træk for én person`,
        [['rejser',kr0(ok.length)],['gæster',kr0(gaesterAf(ok))]]));
  })();

  /* det stoerste selskab */
  (()=>{ const t=ok.reduce((a,x)=>(x.pax_count||0)>(a.pax_count||0)?x:a,ok[0]||{}); if(!t||!t.pax_count||t.pax_count<6) return;
    const store=ok.filter(x=>(x.pax_count||0)>=8);

      fTal(String(t.pax_count),'rejsende',`på booking ${t.ref_no||'—'}`,
        [['rejser med 8+',store.length],['snit pr. rejse',(gaesterAf(ok)/ok.length).toFixed(1)]]));
  })();

  /* den dyreste rejse */
  (()=>{ const t=pris.reduce((a,x)=>+x.package_sell_dkk>+a.package_sell_dkk?x:a,pris[0]||{}); if(!t||!t.package_sell_dkk) return;
    const over=pris.filter(x=>+x.package_sell_dkk>=300000).length;
    PS('tal','Den dyreste rejse','hele historikken',
      `Den største enkeltrejse blev solgt for <b>${kr0(t.package_sell_dkk)} kr.</b>`,
      `Salgspris på én booking, omregnet til kroner. ${t.pax_count?t.pax_count+' rejsende. ':''}${over} rejser har rundet 300.000 kr.`,
      fTal(kr0(t.package_sell_dkk),'kr.',`booking ${t.ref_no||'—'}${t.departure_date?' · afrejse '+fmtD(t.departure_date):''}`,
        [['rejser over 300.000',over],['snit pr. rejse',kr0(omsAf(pris)/pris.length)+' kr.']]));
  })();

  /* den travleste dag */
  (()=>{ const d={}; pris.forEach(t=>{ if(t.booking_date) d[t.booking_date]=(d[t.booking_date]||0)+1; });
    const par=Object.entries(d); if(par.length<50) return;
    const top=par.reduce((a,x)=>x[1]>a[1]?x:a);
    const snit=(par.reduce((s,x)=>s+x[1],0)/par.length).toFixed(1);
    PS('tal','Den travleste dag','hele historikken',
      `<b>${top[1]} rejser</b> blev solgt på én enkelt dag.`,
      `Flest bookinger registreret på samme dato: ${fmtD(top[0])}. Til sammenligning bliver der solgt ${snit} rejser på en helt almindelig arbejdsdag.`,
      fTal(String(top[1]),'rejser på én dag',fmtD(top[0]),
        [['en almindelig dag',snit],['dage med salg',kr0(par.length)]]));
  })();

  /* laengst frem og kortest varsel */
  (()=>{ const b=pris.filter(t=>t.booking_date&&t.departure_date&&t.departure_date>=t.booking_date);
    if(b.length<50) return;
    const dg=t=>Math.round((new Date(t.departure_date)-new Date(t.booking_date))/86400000);
    const rim=b.filter(t=>dg(t)<1100);
    const lang=rim.reduce((a,x)=>dg(x)>dg(a)?x:a,rim[0]);
    const kort=b.reduce((a,x)=>dg(x)<dg(a)?x:a,b[0]);
    PS('tal','Længst frem — og kortest varsel','hele historikken',
      `Én kunde bookede <b>${Math.round(dg(lang)/30)} måneder</b> før afrejse.`,
      `Flest dage mellem booking og afrejse: ${kr0(dg(lang))} dage. I den anden ende blev en rejse solgt med ${dg(kort)} ${dg(kort)===1?'dags':'dages'} varsel.`,
      fTal(kr0(dg(lang)),'dage i forvejen',`booking ${lang.ref_no||'—'}`,
        [['kortest varsel',dg(kort)+' dage'],['typisk',Math.round(b.reduce((s,t)=>s+dg(t),0)/b.length)+' dage']]));
  })();

  /* den laengste rejse */
  (()=>{ const r=ok.filter(t=>nat1(t)>0&&nat1(t)<=60); if(r.length<50) return;
    const t=r.reduce((a,x)=>nat1(x)>nat1(a)?x:a,r[0]);
    const over3=r.filter(x=>nat1(x)>=21).length;
    PS('tal','Den længste rejse','hele historikken',
      `Nogen blev væk i <b>${nat1(t)} nætter</b>.`,
      `Længste ophold målt fra afrejse til hjemrejse. Rejser over 60 nætter er udeladt — de er åbne billetter og gavekort, ikke ferier. ${over3} rejser har varet tre uger eller mere.`,
      fTal(String(nat1(t)),'nætter',`booking ${t.ref_no||'—'}${t.departure_date?' · '+fmtD(t.departure_date):''}`,
        [['tre uger eller mere',over3],['typisk rejse',Math.round(r.reduce((s,x)=>s+nat1(x),0)/r.length)+' nætter']]));
  })();

  /* jul og nytaar */
  (()=>{ const jul=ok.filter(t=>t.departure_date&&(t.departure_date.slice(5)>='12-18'||t.departure_date.slice(5)<='01-02'));
    if(jul.length<10) return;
    const g=gaesterAf(jul), andel=Math.round(100*jul.length/ok.length);
    PS('tal','Jul og nytår i Maldiverne','hele historikken',
      `<b>${kr0(g)} gæster</b> har fejret jul eller nytår gennem jer.`,
      `Rejser med afrejse mellem 18. december og 2. januar. Det er ${andel} % af alt hvad I har sendt afsted — på under en tyvendedel af årets dage.`,
      fTal(String(jul.length),'rejser','afrejst mellem 18. dec. og 2. jan.',
        [['gæster',kr0(g)],['andel af alle rejser',andel+' %']]));
  })();

  /* fyldte fly */
  (()=>{ const g=gaesterAf(ok); if(g<300) return;
    const fly=(g/293).toFixed(1);
    PS('tal','Nok til at fylde fly','alt hvad I har solgt',
      `I har sendt <b>${kr0(g)} mennesker</b> til Det Indiske Ocean.`,
      `Antal rejsende lagt sammen over alle rejser. Et Emirates-fly til Malé har omkring 293 sæder — så det svarer til ${fly} fyldte fly.`,
      fTal(fly,'fyldte fly',`${kr0(g)} rejsende i alt`,
        [['rejser',kr0(ok.length)],['snit pr. rejse',(g/ok.length).toFixed(1)+' pers.']]));
  })();

  /* den mest trofaste kunde */
  (()=>{ const pr={};
    ok.forEach(t=>{ if(!t.customer_id) return; const k=pr[t.customer_id]=pr[t.customer_id]||{n:0,sum:0,navn:''};
      k.n++; k.sum+=+(t.package_sell_dkk||0);
      if(t.customers) k.navn=`${t.customers.first_name||''} ${t.customers.last_name||''}`.trim(); });
    const alle=Object.values(pr); if(alle.length<50) return;
    const top=alle.reduce((a,x)=>x.n>a.n?x:a,alle[0]);
    if(top.n<4) return;
    PS('tal','Den mest trofaste','hele historikken',
      `Én kunde har rejst med jer <b>${top.n} gange</b>.`,
      `Flest bookinger på samme kunde${top.navn?' — '+top.navn:''}. Tilsammen ${kr0(top.sum)} kr. ${alle.filter(x=>x.n>=3).length} kunder har rejst tre gange eller mere.`,
      fTal(String(top.n),'rejser',top.navn||'samme kunde',
        [['lagt hos jer',kr0(top.sum)+' kr.'],['kunder med 3+',alle.filter(x=>x.n>=3).length]]));
  })();

  /* skudmaaneden — hvilken dato der er den travleste afrejsedag */
  (()=>{ const d={}; ok.forEach(t=>{ if(t.departure_date) d[t.departure_date.slice(5)]=(d[t.departure_date.slice(5)]||0)+1; });
    const par=Object.entries(d); if(par.length<100) return;
    const top=par.reduce((a,x)=>x[1]>a[1]?x:a);
    const [m,dd]=top[0].split('-');

      `<b>${+dd}. ${MN[+m-1]}</b> er dagen flest er rejst afsted.`,
      `Alle afrejser lagt oven på hinanden i én kalender, uanset år. ${top[1]} rejser er startet netop den dato.`,
      fTal(`${+dd}. ${MN[+m-1]}`,'',`${top[1]} afrejser gennem årene`,
        [['datoer med afrejse',par.length],['snit pr. dato',(ok.length/par.length).toFixed(1)]]));
  })();

  /* de sjaeldne destinationer */
  (()=>{ const d={}; ok.forEach(t=>(t.trip_destinations||[]).forEach(x=>{ if(x.destination) d[x.destination]=(d[x.destination]||0)+1; }));
    const par=Object.entries(d); if(par.length<20) return;

      fTal(String(enkelt.length),'engangsdestinationer',`ud af ${par.length} steder i alt`,
        [['mest brugte',top[0]],['rejser dertil',kr0(top[1])]]));
  })();

  return ud;
}

/* ── visning: fire kort, hver med sin egen ─────────────────────────── */
/* Rollefordelingen paa de fire kort — raekkefoelgen er pladsernes raekkefoelge. */
const KORTKAT=['pers','nu','total','sjov'];
function tegnIndsigtskort(idx, plads){
  const alle=window.__INDSIGTER||[]; if(!alle.length) return '';
  const d=alle[idx%alle.length];
  return `<div class="icard f-${d.form}" onclick="skiftIndsigt(${plads})" title="Klik for en anden indsigt">
    <div class="ih"><span>${escH(d.titel)}</span><em>${escH((d.periode||'').toLowerCase()===d.titel.toLowerCase()?'':(d.periode||''))}</em><i>↻</i></div>
    <p class="il">${d.l}</p>
    ${d.g}
    <p class="ie">${escH(d.e)}</p>
  </div>`;
}
function skiftIndsigt(plads){
  const alle=window.__INDSIGTER||[]; if(alle.length<5) return;
  const brugt=window.__valgte||[];
  // foerste kort skifter kun mellem de personlige
  const pulje=alle.map((d,i)=>({d,i})).filter(x=>x.d.kat===KORTKAT[plads]).map(x=>x.i);
  if(!pulje.length) return;
  let n; let forsoeg=0;
  do { n=pulje[Math.floor(Math.random()*pulje.length)]; forsoeg++; } while(brugt.includes(n) && forsoeg<40);
  brugt[plads]=n; window.__valgte=brugt;
  const el=document.getElementById('ikort'+plads);
  if(el) el.outerHTML=`<div id="ikort${plads}">${tegnIndsigtskort(n,plads)}</div>`;
}
function tegnIndsigter(){
  const alle=window.__INDSIGTER||[]; const boks=document.getElementById('insgrid');
  if(!boks) return;
  if(!alle.length){ boks.innerHTML='<p class="muted">Der er endnu ikke data nok til at finde mønstre.</p>'; return; }
  /* Udvalget skifter fra dag til dag: datoen bruges som froe, saa man ser noget nyt
     hver morgen — men det samme hvis man genindlaeser i loebet af dagen. */
  const froe=(()=>{ const d=new Date(); return d.getFullYear()*1000+d.getMonth()*40+d.getDate(); })();
  let n=froe; const rnd=()=>{ n=(n*1103515245+12345)&0x7fffffff; return n/0x7fffffff; };
  /* Hvert kort har sin faste rolle — kort 1 personligt, kort 2 aktuelt,
     kort 3 hele historikken, kort 4 sjovt at vide. Kun indholdet skifter. */
  const valgt=[];
  KORTKAT.forEach(kat=>{
    const p=alle.map((d,i)=>({d,i})).filter(x=>x.d.kat===kat && !valgt.includes(x.i));
    if(p.length) valgt.push(p[Math.floor(rnd()*p.length)].i);
  });
  // Skulle en kategori mangle indhold, fyldes pladsen op med hvad der er
  alle.forEach((d,i)=>{ if(valgt.length<4 && !valgt.includes(i)) valgt.push(i); });
  window.__valgte=valgt;
  boks.innerHTML=valgt.map((n,p)=>`<div id="ikort${p}">${tegnIndsigtskort(n,p)}</div>`).join('');
  const p=personligLinje(window.__DASHTRIPS);
  const boksP=document.getElementById('insq');
  if(boksP) boksP.innerHTML = p ? `<p>${p}</p>` : '';
}

/* Feltoverskriften fra henvendelsesformularen er havnet OVEN I kundens tekst ved
   importen. Fire varianter daekker 142 af henvendelserne. Vi fjerner kun linjen
   naar den staar helt alene oeverst og matcher praecist - resten roeres ikke. */
const HV_STDLINJER = ['ønsker og forventninger til reisen','ønsker og forventninger til rejsen','ønsker til rejsen','ønsker til reisen','besked','melding','beskjed'];
function hvRensOnsker(t){
  if(!t) return '';
  const l=String(t).replace(/\r/g,'').split('\n');
  while(l.length && HV_STDLINJER.includes(l[0].trim().toLowerCase().replace(/[:：]\s*$/,''))) l.shift();
  while(l.length && !l[0].trim()) l.shift();
  return l.join('\n').trim();
}
/* 59 henvendelser har et tilbudslink liggende inde i fritekstfelterne — typisk
   som «TILBUD KLAR - https://…» — mens kun 2 har det i offer_url. Vi VISER dem,
   men skriver dem ikke i databasen; det er en beslutning for Wendie. */
function hvLinksIFritekst(l){
  const t=[l.travel_wishes,l.wishes,l.notes,l.highlights,l.offer_url].filter(Boolean).join(' \n ');
  const m=t.match(/https?:\/\/[^\s<>"')]+/gi)||[];
  const set=[...new Set(m.map(u=>u.replace(/[.,;)]+$/,'')))];
  return set.filter(u=>/maldivia|tilbud/i.test(u));
}

/* Hvor mange dage henvendelsen har ligget paa HVERT trin, regnet ud af stadieskiftene. */
function hvTrinDage(l, acts){
  const skift = acts.filter(a=>a.type==='system' && a.stage)
                    .map(a=>({stage:a.stage, t:new Date(a.occurred_at)}))
                    .sort((a,b)=>a.t-b.t);
  const ud={}; const nu=new Date();
  let stage = skift.length ? 'new_lead' : l.stage;
  let fra = new Date(l.created_at);
  const laeg=(st,ms)=>{ if(!st) return; ud[st]=(ud[st]||0)+Math.max(0,ms); };
  for(const s of skift){ laeg(stage, s.t-fra); stage=s.stage; fra=s.t; }
  laeg(stage, nu-fra);
  const dage={}; Object.keys(ud).forEach(k=>{ dage[k]=Math.floor(ud[k]/86400000); });
  return dage;
}

async function viewHenvendelser(){
  if(!hasPerm('leads')) return noAccess('leads');
  navTo('hv');
  const harCache = !!(window._leads && window._leads.length && window._TEAM);
  if(harCache) hvBoardRender();
  else app.innerHTML = '<div class="pagehead"><h2>Henvendelser</h2></div><div class="card">Henter…</div>';
  const pLeads = fetchLeads();
  const pBerig = Promise.all([
    db.from('lead_activities').select('lead_id,occurred_at').eq('type','system').not('stage','is',null).order('occurred_at',{ascending:false}),
    db.from('team_members').select('name,initials,active'),
    db.from('v_lead_kundehistorik').select('lead_id,antal_rejser')
  ]).catch(()=>null);
  const leads = await pLeads;
  window._leads = leads;
  const berig = await pBerig;

    const smap={}; (actR.data||[]).forEach(a=>{ if(!smap[a.lead_id]) smap[a.lead_id]=a.occurred_at; });
    const hmap={}; (histR&&histR.data||[]).forEach(h=>{ hmap[h.lead_id]=+h.antal_rejser||0; });
    leads.forEach(l=>{ l._stageSince=smap[l.id]||l.created_at; l._koeb=hmap[l.id]||0; });

    window._TEAM=(teamR.data||[]).filter(u=>u.active!==false && !/test|maka/i.test((u.initials||'')+(u.name||''))).map(u=>[u.initials,(u.name||'').split(' ')[0]||u.initials]);

  hvBoardRender();
}

function hvCard(l){
  const tr=triage(l);
  const dests=destList(l.destination).slice(0,3);
  const d=daysSince(l._stageSince||l.created_at);
  const a=tnum(l.adults), k=tnum(l.kids)||0;
  const ages=(l.child_ages||'').split(/\s*,\s*/).filter(x=>x!=='');
  const pp=[]; if(a) pp.push(a===1?'1 voksen':a+' voksne');
  if(k>0) pp.push((k===1?'1 barn':k+' børn')+(ages.length?' ('+ages.join(', ')+')':''));
  let nn=tnum(l.nights);
  if(nn==null && l.departure_date && l.return_date){ const df=Math.round((new Date(l.return_date)-new Date(l.departure_date))/86400000); if(df>0) nn=df; }
  const datoer = l.departure_date ? fmtDY(l.departure_date)+(l.return_date?' → '+fmtDY(l.return_date):'') : (l.earliest_departure? fmtDY(l.earliest_departure)+' (tidligst)':'—');
  const cur=leadCur(l);
  const budFejl = (+l.est_value<0) || (tr.total!=null && tr.total<0) || (tr.perPerson!=null && tr.perPerson<0);
  const bud = budFejl ? '<div class="bud none" title="Beløbet i data er negativt — se henvendelsen efter">Budget uklart</div>'
    : (tr.total!=null ? `<div class="bud">${fval(tr.total)} <span class="cur">${cur}</span></div>`
    : (tr.perPerson!=null ? `<div class="bud">${fval(tr.perPerson)} <span class="cur">${cur}</span> <span class="pp">/pers.</span></div>`
    : '<div class="bud none">Budget ikke oplyst</div>'));
  const brc = /^(MN|NO)$/.test(l.branch||'') ? 'no' : (l.branch==='MD'?'dk':'');
  const ferier = ferieForRejse(l.departure_date||l.earliest_departure, l.return_date||l.latest_return, l.branch, l.departure_airport);
  const koeb=+(l._koeb||0);
  const hjerte = koeb>=2 ? `<span class="ik gengang skin" title="Trofast kunde — ${koeb} rejser købt hos os">💛</span>`
    : (koeb===1?'<span class="ik gengang" title="Genganger — kunden har købt én rejse hos os før">💛</span>':'');
  return `<div class="lc ${brc}" data-id="${l.id}" onclick="hvOpen('${l.id}')"
    draggable="true" ondragstart="hvDragStart(event,'${l.id}')" ondragend="hvDragEnd(event)">
    <div class="nm"><span class="navn">${escH(l.contact_name||l.title||'Uden navn')}</span>${hjerte}</div>
    <div class="scorerow">${tr.complete?`<span class="tri good" title="Foreløbig lead-score">Score ${tr.score}</span>`:`<span class="tri miss" title="Mangler: ${escH(tr.missing.join(', '))}">Mangler info</span>`}
      <span class="ikoner">${tr.complete?(kvalitetsTrin(tr.score)?`<span class="ik" title="${escH((kvalitetsTrin(tr.score)||{}).navn||'')} — lead-score ${tr.score}">${(kvalitetsTrin(tr.score)||{}).ikon||''}</span>`:''):`<span class="ik" title="Mangler oplysninger før den kan vurderes: ${escH(tr.missing.join(', '))}">❓</span>`}</span></div>
    ${dests.length?`<div class="card-chips">${dests.map(x=>`<span class="dchip">${escH(x)}</span>`).join('')}</div>`:''}
    ${pp.length?`<div class="meta">${escH(pp.join(', '))}</div>`:''}
    <div class="meta dates"><span>${escH(datoer)}</span><span>${nn!=null&&nn>0?nn+(nn===1?' nat':' nætter'):''}</span></div>
    ${ferier.length?`<div class="ferie">${ferier.map(f=>`<span class="fchip">${escH(f)}</span>`).join('')}</div>`:''}
    ${bud}
    <div class="foot"><span class="brch ${brc}">${escH(BRANCH_KORT[l.branch]||l.branch||'')}</span>
      <span class="who"><span class="age">${d==null?'—':d+'d'}</span>${l.owner?`<span class="owner">${escH(l.owner)}</span>`:''}</span></div>
  </div>`;
}

/* ── traek og slip: flyt en henvendelse til et andet trin ───────────────
   Selve trin-skiftet skrives til leads.stage. Historikken behoever vi ikke
   roere: databasens trigger trg_lead_log_stage skriver flytningen i
   lead_activities af sig selv, praecis som naar man skifter trin inde i kortet.
   Kolonnen «Uden for flowet» kan man traekke FRA, men ikke TIL — den er ikke
   et rigtigt trin, bare et opsamlingssted for gamle Pipedrive-vaerdier.       */
let _hvDrag=null;
function hvDragStart(e,id){
  _hvDrag=id;
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); }catch(_){}
  e.currentTarget.classList.add('dragging');
  document.querySelectorAll('.hv7 .col[data-stage]:not([data-stage="__rest"])').forEach(c=>c.classList.add('kandrop'));
}
function hvDragEnd(e){
  _hvDrag=null;
  if(e&&e.currentTarget&&e.currentTarget.classList) e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.hv7 .col').forEach(c=>c.classList.remove('kandrop','over'));
}
function hvDragOver(e){
  if(!_hvDrag) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect='move'; }catch(_){}
  e.currentTarget.classList.add('over');
}
function hvDragLeave(e){
  // forlader man kun et barn inde i kolonnen, skal markeringen blive staaende
  if(e.relatedTarget && e.currentTarget.contains(e.relatedTarget)) return;
  e.currentTarget.classList.remove('over');
}
async function hvDrop(e,k){
  e.preventDefault();
  let id=_hvDrag;
  if(!id){ try{ id=e.dataTransfer.getData('text/plain'); }catch(_){} }
  _hvDrag=null;
  document.querySelectorAll('.hv7 .col').forEach(c=>c.classList.remove('kandrop','over'));
  if(!id||!k||k==='__rest') return;
  const l=(window._leads||[]).find(x=>x.id===id);
  if(!l || l.stage===k) return;
  const fra=l.stage, fraTid=l._stageSince;
  // flyt kortet med det samme, saa det foles oejeblikkeligt — og rul tilbage hvis gemningen fejler
  l.stage=k; l._stageSince=new Date().toISOString();
  hvBoardRender();
  const {error}=await db.from('leads').update({stage:k}).eq('id',id);
  if(error){
    l.stage=fra; l._stageSince=fraTid;
    hvBoardRender();
    alert('Kunne ikke flytte henvendelsen:\n\n'+error.message);
    return;
  }
  hvKvit(`${l.contact_name||l.title||'Henvendelsen'} flyttet til «${STAGE_SHORT[k]||LEAD_STAGE_LABEL[k]||k}»`);
}
/* Kort kvittering nede i hjaelpelinjen — forsvinder af sig selv igen. */
function hvKvit(tekst){
  const h=document.getElementById('hvHint'); if(!h) return;
  if(!window._hvHintOrg) window._hvHintOrg=h.innerHTML;
  clearTimeout(window._hvKvitTimer);
  h.innerHTML=`<b>✓</b> ${escH(tekst)}`;
  h.classList.add('kvit');
  window._hvKvitTimer=setTimeout(()=>{
    const hh=document.getElementById('hvHint');
    if(hh){ hh.innerHTML=window._hvHintOrg; hh.classList.remove('kvit'); }
  },2600);
}
